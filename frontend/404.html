<!DOCTYPE html>
<html lang="id">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — AXION Neuralis</title>
  <meta name="theme-color" content="#0b0d14" />

  <style>
    :root { --bg:#0b0d14; --text:#e8eaf0; --muted:#6b7394; --accent:#5b8def; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text);
      padding: 24px; text-align: center;
    }
    h1 { font-size: clamp(3rem, 12vw, 5rem); margin: 0 0 8px; letter-spacing: -0.04em; background: linear-gradient(135deg,#e8eaf0,#5b8def); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    p { color: var(--muted); margin: 0 0 28px; font-size: 1.05rem; }
    a {
      display: inline-block; padding: 12px 24px; border-radius: 10px;
      background: linear-gradient(135deg,#3b5bdb,#2563eb); color: #fff; font-weight: 600;
      text-decoration: none; box-shadow: 0 4px 14px rgba(59,91,219,.35);
    }
    a:hover { opacity: .92; }
  </style>
